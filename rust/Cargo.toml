[package]
name = "getsoundboard"
version = "0.3.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "getSoundBoard"
path = "src/main.rs"

[dependencies]
rodio = { version = "0.20.1", features = ["symphonia-aac", "symphonia-aiff", "symphonia-alac", "symphonia-isomp4"] }
cpal = "0.15.3"
rtrb = "0.3"
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
global-hotkey = "0.7"
directories = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
rfd = "0.15"
hound = "3"
nnnoiseless = "0.5.2"

[target.'cfg(windows)'.dependencies]
tray-icon = "0.25"
winreg = "0.56"
