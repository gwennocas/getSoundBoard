name: Build Windows app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish self-contained app
        shell: pwsh
        run: |
          $version = ([xml](Get-Content getSoundBoard.csproj -Raw)).Project.PropertyGroup.Version
          dotnet publish getSoundBoard.csproj -c Release -p:Platform=x64 -p:Version=$version -r win-x64 --self-contained true -o artifacts/publish
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Create installer
        shell: pwsh
        run: |
          $version = ([xml](Get-Content getSoundBoard.csproj -Raw)).Project.PropertyGroup.Version
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DPublishDir=$((Resolve-Path artifacts/publish).Path)" "/DAppVersion=$version" installer/getSoundBoard.iss
      - uses: actions/upload-artifact@v4
        with:
          name: getSoundBoard-win-x64
          path: artifacts/installer/*.exe
